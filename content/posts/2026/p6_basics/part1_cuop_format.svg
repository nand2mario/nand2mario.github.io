  <text x="342" y="261" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">DSZ [9:7]</text>
  <rect x="380" y="243" width="56" height="28" fill="#E6F0F8" stroke="#2B6CB0" stroke-width="1.1"/>
  <text x="408" y="261" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">ASZ[6]</text>
  <rect x="436" y="243" width="66" height="28" fill="#E6F0F8" stroke="#2B6CB0" stroke-width="1.1"/>
  <text x="469" y="261" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">Scale[5:4]</text>
  <rect x="502" y="243" width="50" height="28" fill="#E6F0F8" stroke="#2B6CB0" stroke-width="1.1"/>
  <text x="527" y="261" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">Op[3:0]</text>
  <text x="566" y="261" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.8" fill="#52606D" text-anchor="start">e.g., 804=LOAD, 800=STA (+widths)</text>

  <!-- MSROM Triad Row -->
  <text x="460" y="300" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#B7791F" text-anchor="middle">MSROM Triad Row: 4,096 Rows x 3 Cuop Slots (3 x 72 = 216 Cuop Bits; uIP = (row[11:0] &lt;&lt; 2) | slot[1:0])</text>
  <rect x="28" y="312" width="288" height="32" fill="#FEF5E7" stroke="#B7791F" stroke-width="1.5"/>
  <text x="172" y="332" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#1E242B" text-anchor="middle">Slot 0 (uIP ...0): 72 bits</text>
  <rect x="316" y="312" width="288" height="32" fill="#FEF5E7" stroke="#B7791F" stroke-width="1.5"/>
  <text x="460" y="332" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#1E242B" text-anchor="middle">Slot 1 (uIP ...1): 72 bits</text>
  <rect x="604" y="312" width="288" height="32" fill="#FEF5E7" stroke="#B7791F" stroke-width="1.5"/>
  <text x="748" y="332" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#1E242B" text-anchor="middle">Slot 2 (uIP ...2): 72 bits</text>
</svg>
