  <!-- Opcode [67:56] Internal Sub-Layouts -->
  <text x="460" y="150" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.8" font-weight="bold" fill="#1B4965" text-anchor="middle">Opcode [67:56] Internal Sub-Layouts by Operation Family</text>

  <text x="208" y="186" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#1E242B" text-anchor="end">Arithmetic:</text>
  <rect x="218" y="167" width="92" height="28" fill="#E6F0F8" stroke="#2B6CB0" stroke-width="1.1"/>
  <text x="264" y="185" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">Base [11:10]</text>
  <rect x="310" y="167" width="92" height="28" fill="#E6F0F8" stroke="#2B6CB0" stroke-width="1.1"/>
  <text x="356" y="185" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">DSZ [9:7]</text>
  <rect x="402" y="167" width="150" height="28" fill="#E6F0F8" stroke="#2B6CB0" stroke-width="1.1"/>
  <text x="477" y="185" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">Sub-op [6:0]</text>
  <text x="566" y="185" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.8" fill="#52606D" text-anchor="start">e.g., 408 | DSZ = ADD.{8,16,32}</text>

  <text x="208" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#1E242B" text-anchor="end">Conditional:</text>
  <rect x="218" y="205" width="212" height="28" fill="#E6F0F8" stroke="#2B6CB0" stroke-width="1.1"/>
  <text x="324" y="223" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">Family Prefix [11:4]</text>
  <rect x="430" y="205" width="122" height="28" fill="#E6F0F8" stroke="#2B6CB0" stroke-width="1.1"/>
  <text x="491" y="223" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.5" fill="#1E242B" text-anchor="middle">Cond [3:0]</text>
  <text x="566" y="223" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="9.8" fill="#52606D" text-anchor="start">e.g., 350 | cc = U_JCC.NT.&lt;cc&gt;</text>

  <text x="208" y="262" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#1E242B" text-anchor="end">Memory / AGU:</text>
