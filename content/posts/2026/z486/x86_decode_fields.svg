<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 325" role="img" aria-labelledby="title desc">
  <title id="title">Division of variable-length x86 instruction decoding between D1 and D2</title>
  <desc id="desc">D1 processes prefixes, escape, opcode, ModR/M, and SIB structure. D2 consumes displacement and immediate literals while calculating the effective address.</desc>
  <defs>
    <style>
      .head{font:600 18px system-ui,sans-serif;fill:#0f172a}.label{font:600 14px system-ui,sans-serif;fill:#0f172a}.small{font:12px system-ui,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1100" height="470" fill="#fff"/>
  <text x="550" y="32" text-anchor="middle" class="head">Variable-length x86 decode: structure first, literals second</text>

  <g transform="translate(55 82)">
    <g text-anchor="middle">
      <rect x="0" y="0" width="145" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="72" y="30" class="label">prefixes</text><text x="72" y="53" class="small">0 or more bytes</text>
      <rect x="155" y="0" width="72" height="72" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="191" y="30" class="label">0F</text><text x="191" y="53" class="small">optional</text>
      <rect x="237" y="0" width="112" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="293" y="30" class="label">opcode</text><text x="293" y="53" class="small">1 byte</text>
      <rect x="359" y="0" width="112" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="415" y="30" class="label">ModR/M</text><text x="415" y="53" class="small">optional</text>
      <rect x="481" y="0" width="96" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="529" y="30" class="label">SIB</text><text x="529" y="53" class="small">optional</text>
      <rect x="587" y="0" width="196" height="72" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="685" y="30" class="label">displacement</text><text x="685" y="53" class="small">0, 1, 2, or 4 bytes</text>
      <rect x="793" y="0" width="196" height="72" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="891" y="30" class="label">immediate</text><text x="891" y="53" class="small">0, 1, 2, or 4 bytes</text>
    </g>

    <path d="M0 174V160H577V174" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="288" y="198" text-anchor="middle" class="label">D1 structural decode</text>
    <text x="288" y="218" text-anchor="middle" class="small">one prefix or 0F per clock; main D1 handles opcode + ModR/M + SIB</text>

    <path d="M587 174V160H989V174" fill="none" stroke="#ea580c" stroke-width="2"/>
    <text x="788" y="198" text-anchor="middle" class="label">D2 literal decode</text>
    <text x="788" y="218" text-anchor="middle" class="small">one displacement or immediate per clock</text>
  </g>
</svg>
