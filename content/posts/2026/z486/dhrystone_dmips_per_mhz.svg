<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
  <title id="title">Dhrystone efficiency</title>
  <desc id="desc">Horizontal bars compare DMIPS per MHz: z386 0.225, ao486 0.194, z486 0.330, PicoRV32 0.244, and VexRiscv 0.730.</desc>
  <rect width="820" height="390" fill="#ffffff"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#20262d">Dhrystone 2.1 efficiency</text>
  <text x="24" y="57" font-family="system-ui, sans-serif" font-size="13" fill="#59636e">Locally reproduced DMIPS/MHz, ideal backing memory</text>

  <g stroke="#d8dde3" stroke-width="1">
    <line x1="210" y1="78" x2="210" y2="334"/>
    <line x1="335" y1="78" x2="335" y2="334"/>
    <line x1="460" y1="78" x2="460" y2="334"/>
    <line x1="585" y1="78" x2="585" y2="334"/>
    <line x1="710" y1="78" x2="710" y2="334"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#69737e" text-anchor="middle">
    <text x="210" y="355">0.0</text>
    <text x="335" y="355">0.2</text>
    <text x="460" y="355">0.4</text>
    <text x="585" y="355">0.6</text>
    <text x="710" y="355">0.8</text>
    <text x="460" y="378">DMIPS/MHz</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="15" fill="#27313a">
    <text x="190" y="111" text-anchor="end">z386</text>
    <text x="190" y="161" text-anchor="end">ao486</text>
    <text x="190" y="211" text-anchor="end" font-weight="700">z486</text>
    <text x="190" y="261" text-anchor="end">PicoRV32</text>
    <text x="190" y="311" text-anchor="end">VexRiscv</text>
  </g>

  <rect x="210" y="91" width="141" height="27" rx="3" fill="#68737f"/>
  <rect x="210" y="141" width="121" height="27" rx="3" fill="#238b8e"/>
  <rect x="210" y="191" width="206" height="27" rx="3" fill="#d65a45"/>
  <rect x="210" y="241" width="152" height="27" rx="3" fill="#4078b8"/>
  <rect x="210" y="291" width="456" height="27" rx="3" fill="#3a8f5c"/>

  <g font-family="ui-monospace, monospace" font-size="13" fill="#20262d">
    <text x="361" y="110">0.225</text>
    <text x="341" y="160">0.194</text>
    <text x="426" y="210" font-weight="700">0.330</text>
    <text x="372" y="260">0.244</text>
    <text x="676" y="310">0.730</text>
  </g>
</svg>
