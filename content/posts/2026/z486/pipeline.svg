<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Intel i486 five-stage instruction pipeline</title>
  <desc id="desc">Four overlapping instructions advance through fetch, decode one, decode two, execute, and write-back. Decode two also performs address generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>
      .head{font:600 16px system-ui,sans-serif;fill:#0f172a}.label{font:600 15px system-ui,sans-serif;fill:#0f172a}.note{font:13px system-ui,sans-serif;fill:#475569}.cycle{font:13px ui-monospace,monospace;fill:#64748b}.grid{stroke:#d7dee8;stroke-width:1}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="430" fill="#fff"/>
  <text x="550" y="28" text-anchor="middle" class="head">Five stages, five instructions in flight</text>
  <g class="cycle" text-anchor="middle">
    <text x="250" y="62">cycle N</text><text x="410" y="62">N+1</text><text x="570" y="62">N+2</text><text x="730" y="62">N+3</text><text x="890" y="62">N+4</text>
  </g>
  <g class="grid"><path d="M170 72H970M170 132H970M170 192H970M170 252H970M170 312H970M170 372H970"/><path d="M330 72V372M490 72V372M650 72V372M810 72V372"/></g>
  <g class="label" text-anchor="end"><text x="150" y="110">instruction A</text><text x="150" y="170">instruction B</text><text x="150" y="230">instruction C</text><text x="150" y="290">instruction D</text><text x="150" y="350">instruction E</text></g>
  <g class="label" text-anchor="middle">
    <g transform="translate(178 79)"><rect width="144" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="72" y="27">FI</text></g>
    <g transform="translate(338 79)"><rect width="144" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="72" y="27">D1</text></g>
    <g transform="translate(498 79)"><rect width="144" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/><text x="72" y="27">D2 + EA</text></g>
    <g transform="translate(658 79)"><rect width="144" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="72" y="27">EX</text></g>
    <g transform="translate(818 79)"><rect width="144" height="44" rx="6" fill="#f3e8ff" stroke="#9333ea"/><text x="72" y="27">WB</text></g>
    <g transform="translate(338 139)"><rect width="144" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="72" y="27">FI</text></g>
    <g transform="translate(498 139)"><rect width="144" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="72" y="27">D1</text></g>
    <g transform="translate(658 139)"><rect width="144" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/><text x="72" y="27">D2 + EA</text></g>
    <g transform="translate(818 139)"><rect width="144" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="72" y="27">EX</text></g>
    <g transform="translate(498 199)"><rect width="144" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="72" y="27">FI</text></g>
    <g transform="translate(658 199)"><rect width="144" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="72" y="27">D1</text></g>
    <g transform="translate(818 199)"><rect width="144" height="44" rx="6" fill="#ffedd5" stroke="#ea580c"/><text x="72" y="27">D2 + EA</text></g>
    <g transform="translate(658 259)"><rect width="144" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="72" y="27">FI</text></g>
    <g transform="translate(818 259)"><rect width="144" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="72" y="27">D1</text></g>
    <g transform="translate(818 319)"><rect width="144" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="72" y="27">FI</text></g>
  </g>
  <path d="M570 388V405H730V388" class="arrow"/>
  <text x="650" y="424" text-anchor="middle" class="note">D2 prepares the address so cache and TLB work can occur in EX</text>
</svg>
