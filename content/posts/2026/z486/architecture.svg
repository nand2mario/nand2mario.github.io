<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">z486 implemented organization</title>
  <desc id="desc">The frontend feeds a shared hardwired and microcoded execution path, which uses common address, data, memory, protection, and x87 units.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>.box{stroke-width:2;rx:7}.h{font:600 18px system-ui,sans-serif;fill:#0f172a}.hs{font:600 16px system-ui,sans-serif;fill:#0f172a}.t{font:14px system-ui,sans-serif;fill:#334155}.s{font:12px system-ui,sans-serif;fill:#64748b}.wire{stroke:#475569;stroke-width:2.2;fill:none}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1100" height="620" fill="#fff"/>
  <text x="550" y="30" text-anchor="middle" class="h">z486: one datapath, two control paths</text>
  <g text-anchor="middle">
    <rect x="40" y="72" width="155" height="76" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="117" y="103" class="h">I-cache</text><text x="117" y="128" class="t">16-byte line</text>
    <rect x="235" y="72" width="155" height="76" class="box" fill="#cffafe" stroke="#0891b2"/><text x="312" y="103" class="h">Prefetch</text><text x="312" y="128" class="t">32-byte queue</text>
    <rect x="430" y="72" width="155" height="76" class="box" fill="#fef3c7" stroke="#d97706"/><text x="507" y="103" class="h">D1</text><text x="507" y="128" class="t">structure + entry</text>
    <rect x="625" y="72" width="155" height="76" class="box" fill="#ffedd5" stroke="#ea580c"/><text x="702" y="103" class="h">D2 / ROM</text><text x="702" y="128" class="t">literals + EA</text>
    <rect x="820" y="72" width="235" height="76" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="937" y="103" class="hs">EX + same-cycle commit</text><text x="937" y="128" class="t">shared architectural datapath</text>
  </g>
  <path d="M195 110H228M390 110H423M585 110H618M780 110H813" class="arrow"/>

  <g text-anchor="middle">
    <rect x="505" y="200" width="225" height="92" class="box" fill="#f3e8ff" stroke="#9333ea"/><text x="617" y="232" class="h">Hardwired control</text><text x="617" y="256" class="t">34 generated recipes</text><text x="617" y="277" class="s">issue, hazards, chaining</text>
    <rect x="770" y="200" width="225" height="92" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="882" y="232" class="h">Microsequencer</text><text x="882" y="256" class="t">original 386 routines</text><text x="882" y="277" class="s">faults, protection, complex ops</text>
  </g>
  <path d="M702 148V176M617 176H882" class="wire"/>
  <path d="M617 176V193" class="arrow"/><path d="M882 176V193" class="arrow"/>
  <path d="M730 246H763" class="arrow"/><path d="M937 200V156" class="arrow"/>

  <g text-anchor="middle">
    <rect x="55" y="372" width="190" height="96" class="box" fill="#f1f5f9" stroke="#475569"/><text x="150" y="405" class="h">Address Unit</text><text x="150" y="430" class="t">EA, IND, stack</text><text x="150" y="451" class="s">segmentation boundary</text>
    <rect x="280" y="372" width="190" height="96" class="box" fill="#f1f5f9" stroke="#475569"/><text x="375" y="405" class="h">Data Unit</text><text x="375" y="430" class="t">GPRs, ALU, shift</text><text x="375" y="451" class="s">multiply / divide</text>
    <rect x="505" y="372" width="190" height="96" class="box" fill="#ecfeff" stroke="#0e7490"/><text x="600" y="405" class="h">Paging + TLB</text><text x="600" y="430" class="t">translation, faults</text><text x="600" y="451" class="s">32-entry TLB</text>
    <rect x="730" y="372" width="190" height="96" class="box" fill="#e0f2fe" stroke="#0369a1"/><text x="825" y="405" class="h">Memory</text><text x="825" y="430" class="t">8K I + 8K D cache</text><text x="825" y="451" class="s">store queue + SDRAM</text>
    <rect x="730" y="512" width="190" height="82" class="box" fill="#fae8ff" stroke="#a21caf"/><text x="825" y="545" class="h">x87</text><text x="825" y="570" class="t">control + executor</text>
  </g>
  <path d="M885 292V330H150V365M885 330H375V365M885 330H600V365M885 330H825V365" class="arrow"/>
  <path d="M245 420H273M470 420H498M695 420H723" class="arrow"/>
  <path d="M825 505V475" class="arrow"/>
  <path d="M600 468V553H723" class="dash"/>
  <text x="490" y="538" text-anchor="middle" class="s">x87 operands use the normal</text>
  <text x="490" y="557" text-anchor="middle" class="s">fault-checked memory path</text>
</svg>
