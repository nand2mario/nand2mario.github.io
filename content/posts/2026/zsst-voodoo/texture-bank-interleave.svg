<rect x="358" y="150" width="72" height="72" fill="#c8dff6" stroke="#ffffff" stroke-width="2"/><text x="394" y="195" text-anchor="middle" class="bank">A</text>
<rect x="430" y="150" width="72" height="72" fill="#f9dfa0" stroke="#ffffff" stroke-width="2"/><text x="466" y="195" text-anchor="middle" class="bank">B</text>
<rect x="70" y="222" width="72" height="72" fill="#bfe5cc" stroke="#ffffff" stroke-width="2"/><text x="106" y="267" text-anchor="middle" class="bank">C</text>
<rect x="142" y="222" width="72" height="72" fill="#e1cbed" stroke="#ffffff" stroke-width="2"/><text x="178" y="267" text-anchor="middle" class="bank">D</text>
<rect x="214" y="222" width="72" height="72" fill="#bfe5cc" stroke="#ffffff" stroke-width="2"/><text x="250" y="267" text-anchor="middle" class="bank">C</text>
<rect x="286" y="222" width="72" height="72" fill="#e1cbed" stroke="#ffffff" stroke-width="2"/><text x="322" y="267" text-anchor="middle" class="bank">D</text>
<rect x="358" y="222" width="72" height="72" fill="#bfe5cc" stroke="#ffffff" stroke-width="2"/><text x="394" y="267" text-anchor="middle" class="bank">C</text>
<rect x="430" y="222" width="72" height="72" fill="#e1cbed" stroke="#ffffff" stroke-width="2"/><text x="466" y="267" text-anchor="middle" class="bank">D</text>
<rect x="70" y="294" width="72" height="72" fill="#c8dff6" stroke="#ffffff" stroke-width="2"/><text x="106" y="339" text-anchor="middle" class="bank">A</text>
