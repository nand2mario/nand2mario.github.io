<text x="53" y="267" text-anchor="middle" class="small">1</text>
<text x="53" y="339" text-anchor="middle" class="small">2</text>
<text x="53" y="411" text-anchor="middle" class="small">3</text>
<rect x="72" y="152" width="140" height="140" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 5" rx="3"/>
<rect x="286" y="222" width="144" height="144" fill="none" stroke="white" stroke-width="9" rx="4"/>
<rect x="286" y="222" width="144" height="144" fill="none" stroke="#b74713" stroke-width="5" rx="4"/>
<text x="286" y="474" text-anchor="middle" class="t">Dashed: aligned. Orange: crosses blocks.</text>
<path d="M508 294H642" class="arrow"/>
<text x="575" y="273" text-anchor="middle" class="small">selected 2×2</text>
<text x="750" y="131" text-anchor="middle" class="sh">Same four banks</text>
<rect x="660" y="160" width="90" height="90" fill="#e1cbed" stroke="#ffffff" stroke-width="2"/><text x="705" y="214" text-anchor="middle" class="bank">D</text>
<rect x="750" y="160" width="90" height="90" fill="#bfe5cc" stroke="#ffffff" stroke-width="2"/><text x="795" y="214" text-anchor="middle" class="bank">C</text>
<rect x="660" y="250" width="90" height="90" fill="#f9dfa0" stroke="#ffffff" stroke-width="2"/><text x="705" y="304" text-anchor="middle" class="bank">B</text>
<rect x="750" y="250" width="90" height="90" fill="#c8dff6" stroke="#ffffff" stroke-width="2"/><text x="795" y="304" text-anchor="middle" class="bank">A</text>
<rect x="660" y="160" width="180" height="180" fill="none" stroke="#b74713" stroke-width="4" rx="3"/>
<text x="888" y="214" class="t">Shift the window:</text>
<text x="888" y="248" class="sh">positions change,</text>
<text x="888" y="282" class="sh">banks never collide.</text>
<text x="900" y="392" text-anchor="middle" class="t">One even and one odd column,</text>
<text x="900" y="424" text-anchor="middle" class="t">one even and one odd row.</text>
<path d="M750 449V488H180M750 488H1020" stroke="#475569" stroke-width="2.5" fill="none"/>
<path d="M180 488V514" class="arrow"/><path d="M460 488V514" class="arrow"/><path d="M740 488V514" class="arrow"/><path d="M1020 488V514" class="arrow"/>
<rect x="60" y="520" width="240" height="100" rx="12" fill="#c8dff6" stroke="#475569" stroke-width="2"/><text x="180" y="555" text-anchor="middle" class="sh">Bank A</text><text x="180" y="591" text-anchor="middle" class="t">Read texel (4, 2)</text>
<rect x="340" y="520" width="240" height="100" rx="12" fill="#f9dfa0" stroke="#475569" stroke-width="2"/><text x="460" y="555" text-anchor="middle" class="sh">Bank B</text><text x="460" y="591" text-anchor="middle" class="t">Read texel (3, 2)</text>
<rect x="620" y="520" width="240" height="100" rx="12" fill="#bfe5cc" stroke="#475569" stroke-width="2"/><text x="740" y="555" text-anchor="middle" class="sh">Bank C</text><text x="740" y="591" text-anchor="middle" class="t">Read texel (4, 1)</text>
<rect x="900" y="520" width="240" height="100" rx="12" fill="#e1cbed" stroke="#475569" stroke-width="2"/><text x="1020" y="555" text-anchor="middle" class="sh">Bank D</text><text x="1020" y="591" text-anchor="middle" class="t">Read texel (3, 1)</text>
<text x="600" y="661" text-anchor="middle" class="sh">Four independent addresses → four texels read in parallel</text>
<text x="600" y="699" text-anchor="middle" class="small">Illustrative within-level interleaving; letters are not physical SST-1 chip numbers.</text>
</svg>
