<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Any 2×2 texel neighborhood reaches all four banks</title>
<desc id="desc">A six-column, four-row texture alternates banks A B and C D. An aligned window contains A B above C D. A second window starts at column 3, row 1 and crosses both repeating-block boundaries, containing D C above B A. Its four texels still require exactly one read from each bank. This illustrates parity interleaving, not SST-1's physical chip numbering.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3z" fill="#475569"/></marker>
<style>
.h { font:700 30px system-ui,sans-serif; fill:#172033; }
.sh { font:700 23px system-ui,sans-serif; fill:#172033; }
.bank { font:700 30px system-ui,sans-serif; fill:#172033; }
.t { font:21px system-ui,sans-serif; fill:#334155; }
.small { font:18px system-ui,sans-serif; fill:#526174; }
.arrow { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
</style></defs>
<rect width="1200" height="720" fill="white"/>
<text x="55" y="55" class="h">Any 2×2 neighborhood reaches all four banks</text>
<text x="286" y="111" text-anchor="middle" class="sh">Bank assignment across a texture</text>
<rect x="70" y="150" width="72" height="72" fill="#c8dff6" stroke="#ffffff" stroke-width="2"/><text x="106" y="195" text-anchor="middle" class="bank">A</text>
<rect x="142" y="150" width="72" height="72" fill="#f9dfa0" stroke="#ffffff" stroke-width="2"/><text x="178" y="195" text-anchor="middle" class="bank">B</text>
<rect x="214" y="150" width="72" height="72" fill="#c8dff6" stroke="#ffffff" stroke-width="2"/><text x="250" y="195" text-anchor="middle" class="bank">A</text>
