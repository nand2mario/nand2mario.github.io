<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Bilinear filtering: four texels become one sample</title>
  <desc id="desc">The sample is three quarters of the way from the left texel centers to the right, and two thirds of the way from top to bottom. Interpolate each horizontal pair using s, then combine the results using t. The sample color is the weighted RGB average of the four opaque texel colors. zSST provides parallel reads through replicated cache arrays.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3z" fill="#475569"/></marker>
    <style>
      .h { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .sh { font: 700 22px system-ui, sans-serif; fill: #172033; }
      .formula { font: 600 23px system-ui, sans-serif; fill: #172033; }
      .t { font: 20px system-ui, sans-serif; fill: #334155; }
      .label { font: 18px system-ui, sans-serif; fill: #526174; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .guide { stroke: #172033; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#fff"/>
  <text x="55" y="55" class="h">Bilinear filtering: four texels become one sample</text>
  <text x="255" y="107" text-anchor="middle" class="sh">Four neighboring texel centers</text>
  <text x="685" y="107" text-anchor="middle" class="sh">1. Interpolate horizontally</text>
  <text x="1015" y="177" text-anchor="middle" class="sh">2. Interpolate vertically</text>

  <!-- Opaque swatches make the illustrated RGB average reproducible. -->
  <g transform="translate(75 140)">
    <rect width="180" height="180" fill="#79a7df"/>
    <rect x="180" width="180" height="180" fill="#f2c270"/>
    <rect y="180" width="180" height="180" fill="#76c695"/>
    <rect x="180" y="180" width="180" height="180" fill="#e08292"/>
    <rect width="360" height="360" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M180 0V360M0 180H360" stroke="#475569" stroke-opacity=".4"/>
    <path d="M90 90H270V270H90ZM225 90V270M90 210H270" class="guide"/>
    <g fill="#172033" stroke="#fff" stroke-width="2">
      <circle cx="90" cy="90" r="7"/><circle cx="270" cy="90" r="7"/>
      <circle cx="90" cy="270" r="7"/><circle cx="270" cy="270" r="7"/>
    </g>
    <text x="22" y="36" class="sh">T00</text><text x="286" y="36" class="sh">T10</text>
    <text x="22" y="338" class="sh">T01</text><text x="286" y="338" class="sh">T11</text>
    <circle cx="225" cy="210" r="11" fill="#caa090" stroke="#172033" stroke-width="3"/>
    <rect x="235" y="218" width="108" height="33" rx="6" fill="#fff" fill-opacity=".94"/>
    <text x="289" y="242" text-anchor="middle" class="t">sample</text>
    <path d="M90 360V395M225 360V395" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M90 385H225" class="arrow"/>
    <text x="180" y="425" text-anchor="middle" class="formula">s = 3/4</text>
  </g>
  <path d="M55 230H75M55 350H75" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M55 230V350" class="arrow"/>
  <text transform="translate(32 290) rotate(-90)" text-anchor="middle" class="formula">t = 2/3</text>

  <!-- Each row feeds its own horizontal interpolation. -->
  <path d="M435 230H485V205H530" class="arrow"/>
  <path d="M435 410H485V395H530" class="arrow"/>
  <rect x="540" y="155" width="290" height="100" rx="14" fill="#f1f5f9" stroke="#40536d" stroke-width="2"/>
  <text x="685" y="188" text-anchor="middle" class="label">Top pair</text>
  <text x="685" y="223" text-anchor="middle" class="formula">A = lerp(T00, T10, s)</text>
  <rect x="540" y="345" width="290" height="100" rx="14" fill="#f1f5f9" stroke="#40536d" stroke-width="2"/>
  <text x="685" y="378" text-anchor="middle" class="label">Bottom pair</text>
  <text x="685" y="413" text-anchor="middle" class="formula">B = lerp(T01, T11, s)</text>
  <path d="M830 205H875V300" stroke="#475569" stroke-width="2.5" fill="none"/>
  <path d="M830 395H875V300H930" class="arrow"/>
  <circle cx="1015" cy="300" r="75" fill="#caa090" stroke="#40536d" stroke-width="3"/>
  <text x="1015" y="293" text-anchor="middle" class="sh">Filtered</text>
  <text x="1015" y="322" text-anchor="middle" class="sh">sample</text>
  <text x="1015" y="414" text-anchor="middle" class="formula">lerp(A, B, t)</text>

  <text x="825" y="505" text-anchor="middle" class="formula">lerp(a, b, f) = (1 − f)a + fb</text>
  <text x="825" y="539" text-anchor="middle" class="t">Blend each color channel independently.</text>
  <text x="600" y="610" text-anchor="middle" class="t">s and t are fractions between neighboring texel centers, from 0 to 1.</text>
  <rect x="55" y="642" width="1090" height="83" rx="16" fill="#fff2cc" stroke="#b98521" stroke-width="2"/>
  <text x="600" y="674" text-anchor="middle" class="sh">Four parallel texel reads keep the filter fed</text>
  <text x="600" y="705" text-anchor="middle" class="t">zSST uses replicated cache arrays; cache hits can sustain one sample per clock.</text>
</svg>
