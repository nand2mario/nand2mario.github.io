<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Original SST-1 and zSST memory systems</title>
  <desc id="desc">SST-1 uses independent 64-bit EDO paths for framebuffer and texture memory. zSST shares a 128-bit renderer DDR port and hides latency with caches, miss tracking, tagged requests, replay, and ordered retirement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#40536d"/></marker>
    <style>
      .h { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .col { font: 700 24px system-ui, sans-serif; fill: #172033; }
      .sh { font: 700 17px system-ui, sans-serif; fill: #172033; }
      .t { font: 14px system-ui, sans-serif; fill: #334155; }
      .small { font: 12px system-ui, sans-serif; fill: #526174; }
      .box { stroke: #40536d; stroke-width: 2; rx: 12; }
      .arrow { stroke: #40536d; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .bus { stroke: #7c3aed; stroke-width: 7; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="55" y="52" class="h">Dedicated EDO bandwidth versus latency-tolerant shared DDR</text>
  <line x1="600" y1="82" x2="600" y2="670" stroke="#cbd5e1" stroke-width="2"/>

  <text x="300" y="100" text-anchor="middle" class="col">Voodoo Graphics, 1996</text>
  <text x="300" y="126" text-anchor="middle" class="t">deterministic, physically separate paths</text>
  <rect x="60" y="160" width="155" height="90" class="box" fill="#e8f1ff"/>
  <text x="137" y="196" text-anchor="middle" class="sh">FBI</text>
  <text x="137" y="220" text-anchor="middle" class="small">pixels + video</text>
  <rect x="385" y="160" width="155" height="90" class="box" fill="#f6e6ff"/>
  <text x="462" y="196" text-anchor="middle" class="sh">TREX / TMU</text>
  <text x="462" y="220" text-anchor="middle" class="small">texture filtering</text>
  <path d="M137 250V315" class="bus"/>
  <path d="M462 250V315" class="bus"/>
  <text x="152" y="289" class="small">64-bit</text><text x="477" y="289" class="small">64-bit</text>
  <rect x="55" y="320" width="165" height="120" class="box" fill="#e7f7ed"/>
  <text x="137" y="355" text-anchor="middle" class="sh">FBI EDO banks</text>
  <text x="137" y="382" text-anchor="middle" class="t">RGB + depth/alpha</text>
  <text x="137" y="409" text-anchor="middle" class="t">400 MB/s bus budget</text>
  <rect x="380" y="320" width="165" height="120" class="box" fill="#fff2cc"/>
  <text x="462" y="355" text-anchor="middle" class="sh">Texture EDO</text>
  <text x="462" y="382" text-anchor="middle" class="t">four-way interleaved</text>
  <text x="462" y="409" text-anchor="middle" class="t">400 MB/s bus budget</text>
  <rect x="55" y="485" width="490" height="120" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="520" text-anchor="middle" class="sh">What the board buys</text>
  <text x="300" y="550" text-anchor="middle" class="t">800 MB/s aggregate across independent paths</text>
  <text x="300" y="576" text-anchor="middle" class="t">one textured and depth-tested pixel per 50 MHz clock</text>

  <text x="900" y="100" text-anchor="middle" class="col">zSST on KV260</text>
  <text x="900" y="126" text-anchor="middle" class="t">shared DDR, made tolerant of variable latency</text>
  <rect x="650" y="155" width="210" height="115" class="box" fill="#e8f1ff"/>
  <text x="755" y="187" text-anchor="middle" class="sh">FBI stream</text>
  <text x="755" y="213" text-anchor="middle" class="t">color + AUX caches</text>
  <text x="755" y="238" text-anchor="middle" class="t">replay + write combine</text>
  <rect x="940" y="155" width="210" height="115" class="box" fill="#f6e6ff"/>
  <text x="1045" y="187" text-anchor="middle" class="sh">TMU stream</text>
  <text x="1045" y="213" text-anchor="middle" class="t">2-way texture cache</text>
  <text x="1045" y="238" text-anchor="middle" class="t">ROB + replay + prefetch</text>
  <path d="M755 270V320H875" class="arrow"/>
  <path d="M1045 270V320H925" class="arrow"/>
  <rect x="790" y="310" width="220" height="80" class="box" fill="#ffe8e4"/>
  <text x="900" y="340" text-anchor="middle" class="sh">Tagged arbiter</text>
  <text x="900" y="366" text-anchor="middle" class="t">several requests in flight</text>
  <path d="M900 390V444" class="bus"/>
  <text x="915" y="421" class="small">128-bit AXI HP2</text>
  <rect x="790" y="450" width="220" height="85" class="box" fill="#e7f7ed"/>
  <text x="900" y="483" text-anchor="middle" class="sh">Shared DDR4</text>
  <text x="900" y="506" text-anchor="middle" class="small">burst bandwidth</text>
  <text x="900" y="524" text-anchor="middle" class="small">long first-word latency</text>
  <rect x="635" y="575" width="165" height="70" class="box" fill="#f8fafc"/>
  <text x="717" y="605" text-anchor="middle" class="sh">PC / CPU</text>
  <text x="717" y="627" text-anchor="middle" class="small">HP0</text>
  <rect x="817" y="575" width="165" height="70" class="box" fill="#f8fafc"/>
  <text x="899" y="605" text-anchor="middle" class="sh">Renderer</text>
  <text x="899" y="627" text-anchor="middle" class="small">HP2</text>
  <rect x="999" y="575" width="165" height="70" class="box" fill="#f8fafc"/>
  <text x="1081" y="605" text-anchor="middle" class="sh">Scanout</text>
  <text x="1081" y="627" text-anchor="middle" class="small">HP3</text>
  <text x="900" y="680" text-anchor="middle" class="t">Caches reduce average latency; tags and replay keep useful work moving.</text>
</svg>
