<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc">
  <title id="title">Pentium Pro pipeline stage timeline</title>
  <desc id="desc">Time runs left to right within the front-end and post-reservation-station segments. Front-end stages 16 and 20 share a cycle, as do stages 17 and 21. After a variable reservation-station wait, separate lanes show single-cycle, multicycle, cache-hit and memory-retry paths. Vertically aligned execution and writeback stages overlap in time.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#51637b"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 30px system-ui, sans-serif; fill: #17243a; }
    .subtitle { font: 17px system-ui, sans-serif; fill: #52627a; }
    .lane { font: 700 20px system-ui, sans-serif; fill: #17243a; }
    .hint { font: 15px system-ui, sans-serif; fill: #52627a; }
    .number { font: 700 20px system-ui, sans-serif; fill: #17243a; }
    .label { font: 10.5px system-ui, sans-serif; fill: #33435b; }
    .long-label { font: 700 16px system-ui, sans-serif; fill: #33435b; }
    .cell rect, .long-cell rect { stroke-width: 1.4; rx: 6; }
    .front rect { fill: #eaf1ff; stroke: #93add8; }
    .rename rect { fill: #eaf6ed; stroke: #86b494; }
    .execute rect { fill: #f3ebff; stroke: #b6a0d4; }
    .memory rect { fill: #e7f5f4; stroke: #8bbdb7; }
    .writeback rect { fill: #fff0dc; stroke: #d9b483; }
    .retire rect { fill: #ffebef; stroke: #d8a4af; }
    .rule { stroke: #d7dfe9; stroke-width: 1.5; }
    .guide { stroke: #e9eef5; stroke-width: 1.3; }
    .result { fill: none; stroke: #76889e; stroke-width: 1.8; stroke-dasharray: 5 5; }
    .flow { fill: none; stroke: #51637b; stroke-width: 2.2; marker-end: url(#arrow); }
  </style>

  <rect width="1200" height="1070" fill="#fff"/>
  <text class="title" x="36" y="47">P6 pipeline: concurrent stage timelines</text>
  <text class="subtitle" x="36" y="77">Time →  Within each segment, boxes in one column share a cycle; waits have variable length.</text>

  <rect x="205" y="116" width="960" height="160" rx="12" fill="#f8fafc"/>
  <text class="lane" x="36" y="173">In-order path</text>
  <text class="hint" x="36" y="196">fetch and decode</text>
  <text class="hint" x="36" y="247">queue and rename</text>
  <text class="hint" x="220" y="134">INSTRUCTION STREAM</text>

  <g class="cell front" transform="translate(220 145)"><rect width="60" height="54"/><text class="number" x="9" y="23">11</text><text class="label" x="9" y="45">Next IP</text></g>
  <g class="cell front" transform="translate(282 145)"><rect width="60" height="54"/><text class="number" x="9" y="23">12</text><text class="label" x="9" y="45">I-cache</text></g>
  <g class="cell front" transform="translate(344 145)"><rect width="60" height="54"/><text class="number" x="9" y="23">13</text><text class="label" x="9" y="45">ILD</text></g>
  <g class="cell front" transform="translate(406 145)"><rect width="60" height="54"/><text class="number" x="9" y="23">14</text><text class="label" x="9" y="45">Rotate</text></g>
  <g class="cell front" transform="translate(468 145)"><rect width="60" height="54"/><text class="number" x="9" y="23">15</text><text class="label" x="9" y="45">Decode 1</text></g>
  <g class="cell front" transform="translate(530 145)"><rect width="60" height="54"/><text class="number" x="9" y="23">16</text><text class="label" x="9" y="45">Decode 2</text></g>
  <g class="cell front" transform="translate(592 145)"><rect width="60" height="54"/><text class="number" x="9" y="23">17</text><text class="label" x="9" y="45">BAC</text></g>
  <g class="cell rename" transform="translate(530 203)"><rect width="60" height="54"/><text class="number" x="9" y="23">20</text><text class="label" x="9" y="45">Exit IDQ</text></g>
  <g class="cell rename" transform="translate(592 203)"><rect width="60" height="54"/><text class="number" x="9" y="23">21</text><text class="label" x="9" y="45">Rename</text></g>
  <g class="cell rename" transform="translate(654 203)"><rect width="60" height="54"/><text class="number" x="9" y="23">22</text><text class="label" x="9" y="45">RS data</text></g>
  <text class="hint" x="780" y="181">16 / 20 and 17 / 21</text>
  <text class="hint" x="780" y="204">share cycles.</text>

  <line class="rule" x1="36" y1="292" x2="1165" y2="292"/>
  <text class="hint" x="210" y="321">After variable RS wait, the time axis resumes for ready µops.</text>

  <g transform="translate(-630 0)">

  <text class="lane" x="666" y="379">Single-cycle</text>
  <text class="hint" x="666" y="402">integer µop</text>
  <g class="cell execute" transform="translate(840 342)"><rect width="60" height="54"/><text class="number" x="9" y="23">31</text><text class="label" x="9" y="45">Select</text></g>
  <g class="cell execute" transform="translate(902 342)"><rect width="60" height="54"/><text class="number" x="9" y="23">32</text><text class="label" x="9" y="45">Dispatch</text></g>
  <g class="cell execute" transform="translate(964 342)"><rect width="60" height="54"/><text class="number" x="9" y="23">33</text><text class="label" x="9" y="45">ALU</text></g>
  <g class="cell writeback" transform="translate(902 400)"><rect width="60" height="54"/><text class="number" x="9" y="23">82</text><text class="label" x="9" y="45">WB sel</text></g>
  <g class="cell writeback" transform="translate(964 400)"><rect width="60" height="54"/><text class="number" x="9" y="23">83</text><text class="label" x="9" y="45">WB data</text></g>
  <path class="result" d="M1024 427H1600"/>
  <line class="rule" x1="666" y1="469" x2="1794" y2="469"/>

  <text class="lane" x="666" y="531">Multicycle</text>
  <text class="hint" x="666" y="554">multiply / FP</text>
  <g class="cell execute" transform="translate(840 494)"><rect width="60" height="54"/><text class="number" x="9" y="23">31</text><text class="label" x="9" y="45">Select</text></g>
  <g class="cell execute" transform="translate(902 494)"><rect width="60" height="54"/><text class="number" x="9" y="23">32</text><text class="label" x="9" y="45">Dispatch</text></g>
  <g class="cell execute" transform="translate(964 494)"><rect width="60" height="54"/><text class="number" x="9" y="23">33</text><text class="label" x="9" y="45">Start</text></g>
  <g class="long-cell execute" transform="translate(1026 494)"><rect width="184" height="54"/><text class="long-label" x="13" y="23">Further execution</text><text class="label" x="13" y="44">variable internal latency</text></g>
  <g class="cell writeback" transform="translate(1026 552)"><rect width="60" height="54"/><text class="number" x="9" y="23">81</text><text class="label" x="9" y="45">WB entry</text></g>
  <g class="cell writeback" transform="translate(1088 552)"><rect width="60" height="54"/><text class="number" x="9" y="23">82</text><text class="label" x="9" y="45">WB sel</text></g>
  <g class="cell writeback" transform="translate(1150 552)"><rect width="60" height="54"/><text class="number" x="9" y="23">83</text><text class="label" x="9" y="45">WB data</text></g>
  <path class="result" d="M1210 579H1600"/>
  <line class="rule" x1="666" y1="621" x2="1794" y2="621"/>

  <text class="lane" x="666" y="683">Cache hit</text>
  <text class="hint" x="666" y="706">nonblocking load</text>
  <g class="cell execute" transform="translate(840 646)"><rect width="60" height="54"/><text class="number" x="9" y="23">31</text><text class="label" x="9" y="45">Select</text></g>
  <g class="cell execute" transform="translate(902 646)"><rect width="60" height="54"/><text class="number" x="9" y="23">32</text><text class="label" x="9" y="45">Dispatch</text></g>
  <g class="cell memory" transform="translate(964 646)"><rect width="60" height="54"/><text class="number" x="9" y="23">33</text><text class="label" x="9" y="45">AGU</text></g>
  <g class="cell memory" transform="translate(1026 646)"><rect width="60" height="54"/><text class="number" x="9" y="23">42</text><text class="label" x="9" y="45">DTLB</text></g>
  <g class="cell memory" transform="translate(1088 646)"><rect width="60" height="54"/><text class="number" x="9" y="23">43</text><text class="label" x="9" y="45">DCU</text></g>
  <g class="cell writeback" transform="translate(964 704)"><rect width="60" height="54"/><text class="number" x="9" y="23">81</text><text class="label" x="9" y="45">WB entry</text></g>
  <g class="cell writeback" transform="translate(1026 704)"><rect width="60" height="54"/><text class="number" x="9" y="23">82</text><text class="label" x="9" y="45">WB sel</text></g>
  <g class="cell writeback" transform="translate(1088 704)"><rect width="60" height="54"/><text class="number" x="9" y="23">83</text><text class="label" x="9" y="45">WB data</text></g>
  <path class="result" d="M1148 731H1600"/>
  <line class="rule" x1="666" y1="773" x2="1794" y2="773"/>

  <text class="lane" x="666" y="835">Memory retry</text>
  <text class="hint" x="666" y="858">blocked in MOB</text>
  <g class="cell execute" transform="translate(840 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">31</text><text class="label" x="9" y="45">Select</text></g>
  <g class="cell execute" transform="translate(902 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">32</text><text class="label" x="9" y="45">Dispatch</text></g>
  <g class="cell memory" transform="translate(964 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">33</text><text class="label" x="9" y="45">AGU</text></g>
  <g class="cell memory" transform="translate(1026 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">42</text><text class="label" x="9" y="45">DTLB</text></g>
  <g class="cell memory" transform="translate(1088 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">43</text><text class="label" x="9" y="45">DCU</text></g>
  <g class="long-cell memory" transform="translate(1150 798)"><rect width="176" height="54" stroke-dasharray="5 4"/><text class="long-label" x="12" y="23">MOB wait</text><text class="label" x="12" y="44">variable duration</text></g>
  <g class="cell memory" transform="translate(1336 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">40</text><text class="label" x="9" y="45">Wake</text></g>
  <g class="cell memory" transform="translate(1398 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">41</text><text class="label" x="9" y="45">Reissue</text></g>
  <g class="cell memory" transform="translate(1460 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">42</text><text class="label" x="9" y="45">DTLB</text></g>
  <g class="cell memory" transform="translate(1522 798)"><rect width="60" height="54"/><text class="number" x="9" y="23">43</text><text class="label" x="9" y="45">DCU</text></g>
  <g class="cell writeback" transform="translate(1398 856)"><rect width="60" height="54"/><text class="number" x="9" y="23">81</text><text class="label" x="9" y="45">WB entry</text></g>
  <g class="cell writeback" transform="translate(1460 856)"><rect width="60" height="54"/><text class="number" x="9" y="23">82</text><text class="label" x="9" y="45">WB sel</text></g>
  <g class="cell writeback" transform="translate(1522 856)"><rect width="60" height="54"/><text class="number" x="9" y="23">83</text><text class="label" x="9" y="45">WB data</text></g>
  <path class="result" d="M1582 883H1600"/>
  <line class="rule" x1="666" y1="929" x2="1794" y2="929"/>

  <path class="result" d="M1600 427V966"/>
  <text class="hint" x="1305" y="957">Results enter the ROB</text>
  <path class="flow" d="M1600 966V1005H1609"/>
  <text class="lane" x="666" y="1009">In-order retirement</text>
  <text class="hint" x="666" y="1031">oldest completed µops commit</text>
  <g class="cell retire" transform="translate(1610 978)"><rect width="60" height="54"/><text class="number" x="9" y="23">91</text><text class="label" x="9" y="45">ROB ptr</text></g>
  <g class="cell retire" transform="translate(1672 978)"><rect width="60" height="54"/><text class="number" x="9" y="23">92</text><text class="label" x="9" y="45">ROB rd</text></g>
  <g class="cell retire" transform="translate(1734 978)"><rect width="60" height="54"/><text class="number" x="9" y="23">93</text><text class="label" x="9" y="45">RRF wr</text></g>
  </g>
</svg>
